// ============================================================
// DongFangHongSatellitePads RP-1 Patch - Cost / EntryCost
//
// Purpose:
//   DFH parts have cost=900 but entryCost=50 (stock placeholder).
//   RP-1 does NOT overwrite cost/entryCost for RP0conf=true parts,
//   so we must set proper entryCost values here.
//
//   entryCost set to ~5x the part cost, consistent with RP-1
//   conventions and the KIU_RP1Patch approach.
//
// Values:
//   DFH2/3/4/5_Pad: cost=900 -> entryCost=4500
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- DFH satellite pads (entryCost placeholder fix) ----------
// 东方红二/三/四/五号通信卫星平台: cost=900 -> entryCost=4500
@PART[DFH2_Pad|DFH3_Pad|DFH4_Pad|DFH5_Pad]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
	%entryCost = 4500
}
