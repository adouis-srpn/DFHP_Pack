// ============================================================
// DongFangHongSatellitePads RP-1 Patch - Tech Tree Mapping
//
// Purpose:
//   Map every DFH part's TechRequired to historical RP-1 tech-tree
//   nodes in the Comms category, so parts unlock at the correct
//   year/node in RP-1 career mode.
//
//   Combined with DFHSP_RP1Patch.cfg (which sets RP0conf=True),
//   this makes DFH parts both visible and properly placed in the
//   RP-1 tree. Apply BEFORE[zzzRP-0] so the TechRequired value
//   is set before RP-1's NonRP0 cleanup pass.
//
// Mapping logic:
//   - Reference year = real first-flight / service year of the
//     real-world counterpart.
//   - Category = Comms (DFH = communications satellite platform).
//   - Target node = the node whose year range contains the
//     reference year, per TreeYears.csv Comms category.
//
// Comms node timeline (from TreeYears.csv):
//   1981-1985  largeScaleComms
//   1986-1997  massiveScaleComms
//   1998-2008  efficientComms
//   2009-2018  modernComms
//   2019-2028  advModernComms
//
// Dependencies:
//   - RP-1 (MM identifier: RP-0)
//
// Parts covered: 4 (DFH2/3/4/5_Pad)
// Target nodes:  4
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

// ---------- Comms ----------
// largeScaleComms (1981-1985) - 1 part(s)
// 东方红二号: 首飞 1984, 中国第一颗地球同步通信卫星
@PART[DFH2_Pad]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    @TechRequired = largeScaleComms
}

// massiveScaleComms (1986-1997) - 1 part(s)
// 东方红三号: 首飞 1994, 中国第一代三轴稳定通信卫星平台
@PART[DFH3_Pad]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    @TechRequired = massiveScaleComms
}

// efficientComms (1998-2008) - 1 part(s)
// 东方红四号: 首飞 2006, 中国大容量通信卫星平台 (尼星/委星等)
@PART[DFH4_Pad]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    @TechRequired = efficientComms
}

// advModernComms (2019-2028) - 1 part(s)
// 东方红五号: 首飞 2019 (实践二十号), 中国新一代超大型通信卫星平台
@PART[DFH5_Pad]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    @TechRequired = advModernComms
}
