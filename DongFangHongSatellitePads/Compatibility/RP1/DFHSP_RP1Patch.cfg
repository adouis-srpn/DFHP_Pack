// ============================================================
// DongFangHongSatellitePads RP-1 Patch
// Minimal RP-1 visibility patch for the DFH satellite pad parts.
//
// Purpose:
//   DFH parts (DFH2/3/4/5_Pad) set RSSROConfig=True via their RO
//   compatibility patches but lack the RP0conf marker. RP-1's
//   NonRP0.cfg therefore moves them to category 99 (with
//   FilterExtensions) or -1 (hidden, with NoNonRP0 folder),
//   making them invisible in the VAB/SPH even in sandbox mode.
//
//   This patch stamps RP0conf=True on every DFH part BEFORE the
//   zzzRP-0 pass so RP-1's cleanup logic skips them.
//
// Scope:
//   - Only marks parts as RP-1 configured. Combined with the
//     TechMapping and Cost patches, parts become visible and
//     properly placed in the RP-1 tree.
//
// Dependencies:
//   - RP-1  (ModuleManager identifier: RP-0)
//   DFHSP 补丁位于模组文件夹内, 模组不存在则补丁不存在, 无需 NEEDS[DongFangHongSatellitePads]
//
// Author: Zhuwenqian
// License: CC BY-NC-SA 4.0
// ============================================================

@PART[DFH2_Pad|DFH3_Pad|DFH4_Pad|DFH5_Pad]:NEEDS[RP-0]:BEFORE[zzzRP-0]
{
    %RP0conf = True
}
